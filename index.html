<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reflow">
<meta name="description" content="Read PDF books on your phone with reflowed, resizable text. Free, no account, nothing uploaded.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Reflow PDF Reader</title>
<style>
:root{--size:19px;--lh:1.6;--margin:20px;--bg:#fbfaf7;--fg:#1d1d1b;--muted:#6e6a62;--line:#e4e0d6;--card:#fff;--accent:#2f5d50;--danger:#a8322a;
  --hover:rgba(29,29,27,.06);--ease:cubic-bezier(.2,.8,.2,1);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,"Noto Serif",serif;color-scheme:light}
[data-theme=sepia]{--bg:#f3ead6;--fg:#3a2f22;--muted:#7a6a55;--line:#e0d3b8;--card:#f8f1e1;--accent:#8a5523;--danger:#9c3324;--hover:rgba(58,47,34,.07)}
[data-theme=dark]{--bg:#121211;--fg:#dcd8cf;--muted:#948f85;--line:#2e2d2a;--card:#1c1b19;--accent:#8fc1a9;--danger:#f0a59e;--hover:rgba(220,216,207,.07);color-scheme:dark}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,label.btn{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label.btn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--card)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}

svg{display:block;flex:none}
.btn{gap:6px}
.btn svg{width:18px;height:18px;margin-left:-4px}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:none;color:var(--muted);transition:background-color .15s,color .15s}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{color:var(--fg);background:var(--hover)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Library */
#library{max-width:980px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left));min-height:100vh}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lhead h1{margin:0;font:600 30px/1.1 var(--serif);letter-spacing:-.015em}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
#status{min-height:1.4em;margin:10px 0 0;color:var(--muted);font-size:14px}
.sec{margin-top:26px}
.sech{display:flex;align-items:center;gap:8px;min-height:44px;margin:0 0 10px}
.sech h2{margin:0;font:600 20px/1.2 var(--serif);letter-spacing:-.01em;overflow-wrap:anywhere}
.sech .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.sech .icon-btn{margin:0 -10px 0 auto}
.none{margin:0;padding:18px 0;color:var(--muted);font-size:14px}

/* Continue reading: a swipeable row of the books in progress */
.cont{display:flex;gap:12px;margin:0 -16px;padding:2px 16px 8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none}
.cont::-webkit-scrollbar{display:none}
.citem{flex:0 0 min(320px,84%);scroll-snap-align:start;display:flex;gap:14px;align-items:center;padding:12px 14px 12px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;transition:border-color .15s}
.citem:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.citem .cover{width:62px}
.citem .info{flex:1;min-width:0}
.citem .t{font:600 16px/1.3 var(--serif)}
.citem .meta{display:block;margin-top:4px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{display:block;height:3px;margin-top:10px;border-radius:2px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:2px;background:var(--accent)}

/* Shelves: a grid of covers */
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:20px 16px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:28px 24px}}
.book{min-width:0}
.book .open{display:block;width:100%;padding:0;border:0;background:none;text-align:left}
.book .pbar{margin-top:8px}
.book .t{min-height:2.6em;margin-top:8px;font:600 14px/1.3 var(--serif)}
.brow{display:flex;align-items:center;justify-content:space-between;margin-top:1px}
.brow .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.brow .icon-btn{width:40px;height:36px;margin-right:-12px;border-radius:10px}
.cover{position:relative;display:block;aspect-ratio:2/3;border-radius:2px 5px 5px 2px;overflow:hidden;background:var(--card);
  box-shadow:0 1px 2px rgba(0,0,0,.14),0 8px 18px -8px rgba(0,0,0,.35);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.cover::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(90deg,rgba(0,0,0,.16),rgba(255,255,255,.12) 2.5%,rgba(0,0,0,.04) 5%,transparent 9%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.cover img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.open:hover .cover{transform:translateY(-3px);box-shadow:0 2px 3px rgba(0,0,0,.12),0 16px 26px -10px rgba(0,0,0,.4)}
.open:active .cover{transform:translateY(-1px) scale(.985)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:14% 13% 16% 16%;overflow:hidden;
  font:600 15px/1.2 var(--serif);color:var(--fg);background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 22%,var(--card)),var(--card) 70%);hyphens:auto;-webkit-hyphens:auto}
.ph::before{content:"";width:28%;height:2px;background:var(--accent)}
.citem .ph{font-size:9px;padding:12% 10% 14% 14%;gap:4px}

.empty{display:flex;flex-direction:column;align-items:center;margin-top:28px;padding:48px 24px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px}
.empty svg{width:44px;height:44px;margin-bottom:14px;color:var(--accent)}
.empty strong{font:600 20px/1.3 var(--serif);color:var(--fg)}
.empty p{max-width:34ch;margin:6px 0 0;font-size:15px}
#newShelf{margin-top:32px}
body.drag #library{outline:3px dashed var(--accent);outline-offset:-8px}

/* Bottom sheet for book and shelf options */
dialog.sheet{position:fixed;inset:auto 0 0;width:100%;max-width:520px;max-height:85vh;margin:0 auto;padding:10px 8px calc(12px + env(safe-area-inset-bottom));
  border:0;border-radius:18px 18px 0 0;background:var(--card);color:var(--fg);box-shadow:0 -10px 34px rgba(0,0,0,.22);overflow:auto}
dialog.sheet::backdrop{background:rgba(10,10,8,.4)}
dialog.sheet[open],#settings:not([hidden]){animation:rise .24s var(--ease)}
@keyframes rise{from{transform:translateY(28px);opacity:.5}}
.sheet h2{margin:6px 12px 8px;font:600 17px/1.3 var(--serif)}
.sheet .lbl{margin:10px 12px 2px;font-size:13px;color:var(--muted)}
.sheet hr{border:0;border-top:1px solid var(--line);margin:6px 12px}
.act{display:flex;align-items:center;gap:14px;width:100%;min-height:48px;padding:0 12px;border:0;border-radius:10px;background:none;text-align:left;font-size:16px;transition:background-color .15s}
.act:hover{background:var(--hover)}
.act svg{width:20px;height:20px;color:var(--muted)}
.act span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .on{color:var(--accent)}
.act.danger,.act.danger svg{color:var(--danger)}
.nameform{display:flex;gap:8px;padding:6px 12px 4px}
.nameform input{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:16px/1 inherit;font-family:inherit}
.nameform input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

/* Reader */
.rbar{position:fixed;inset:0 0 auto;z-index:5;display:flex;align-items:center;gap:4px;padding:env(safe-area-inset-top) max(6px,env(safe-area-inset-right)) 0 max(6px,env(safe-area-inset-left));
  background:var(--bg);border-bottom:1px solid var(--line);transition:transform .2s}
.rbar button{min-width:44px;height:44px;padding:0 10px;background:none;border:0;border-radius:8px;font-size:15px}
.rbar #back{font-size:28px;line-height:1}
#rtitle{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px;color:var(--muted)}
#reader.hide .rbar{transform:translateY(-100%)}
#reader.hide #pos{opacity:0}
.rbar svg{width:22px;height:22px;margin:auto}
.rbar #setBtn{font:500 17px var(--serif)}
.rbar #setBtn[aria-expanded=true]{color:var(--accent);background:var(--hover)}

/* Reading settings: a sheet at the bottom, so the page above shows each change live */
#settings{position:fixed;z-index:6;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:14px max(20px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  border-radius:18px 18px 0 0;background:var(--card);box-shadow:0 -10px 34px rgba(0,0,0,.2)}
#reader.set #pos{opacity:0}
.size{display:flex;align-items:center;gap:6px}
.size button{display:grid;place-items:center;width:44px;height:44px;flex:none;border:0;border-radius:50%;background:none;font-family:var(--serif);color:var(--fg)}
.size button:hover{background:var(--hover)}
#s-dn{font-size:15px}#s-up{font-size:25px}
#s-size{flex:1;min-width:0;margin:0;accent-color:var(--accent)}
#s-val{width:2.4ch;font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 14px;margin-top:10px}
.sl{display:block;margin:0 0 6px 2px;font-size:13px;color:var(--muted)}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.seg button{flex:1;display:grid;place-items:center;min-width:0;height:38px;padding:0;border:0;border-radius:9px;background:none;color:var(--muted);transition:background-color .15s,color .15s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 18%,var(--card));color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.seg svg{width:22px;height:22px}
.themes{gap:4px}
.themes button{font:600 16px/1 var(--serif);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.themes button[data-t=light]{background:#fbfaf7;color:#1d1d1b}.themes button[data-t=sepia]{background:#f3ead6;color:#3a2f22}.themes button[data-t=dark]{background:#121211;color:#dcd8cf}
.themes button[aria-pressed=true]{box-shadow:0 0 0 2px var(--accent)}
[data-align=justify] #text p:not(.c){text-align:justify;-webkit-hyphens:auto;hyphens:auto}
#text{max-width:calc(34em + 2 * var(--margin));margin:0 auto;padding:calc(64px + env(safe-area-inset-top)) max(var(--margin),env(safe-area-inset-right)) 35vh max(var(--margin),env(safe-area-inset-left));
  font-family:var(--serif);font-size:var(--size);line-height:var(--lh);overflow-wrap:break-word}
#text p{margin:0 0 .75em}
#text h2{font-size:1.45em;line-height:1.25;margin:2.2em 0 1em}
#text h3{font-size:1.15em;line-height:1.3;margin:1.8em 0 .6em}
#text .c{text-align:center}
#text .note{font-size:.82em;color:var(--muted)}
#text .sep::before{content:"\2042";display:block;text-align:center;color:var(--muted);margin:.6em 0 1em}
#text figure{margin:1.2em 0}
#text .pg{background:#fff;border:1px solid var(--line)}
#text .pg img{display:block;width:100%;height:auto}
#text figcaption{font:13px/1.4 system-ui,sans-serif;color:var(--muted);margin-top:6px;text-align:center}
#pos{position:fixed;bottom:0;left:0;right:0;padding:4px 12px calc(4px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--muted);background:var(--bg);transition:opacity .2s}

/* Original page overlay */
#orig{position:fixed;inset:0;z-index:10;overflow:auto;background:var(--bg)}
.obar{position:sticky;top:0;display:flex;align-items:center;gap:4px;padding:env(safe-area-inset-top) 8px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.obar button{min-width:44px;height:44px;background:none;border:0;font-size:22px}
.obar svg{width:24px;height:24px;margin:auto}
.obar .done{font-size:15px;font-weight:600;color:var(--accent);margin-left:auto}
#opage{font-size:14px;color:var(--muted)}
#ocanvas{display:block;margin:16px auto calc(16px + env(safe-area-inset-bottom));max-width:100%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="library">
  <div class="lhead">
    <h1>Reflow</h1>
    <label class="btn primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add PDF<input id="file" type="file" accept="application/pdf,.pdf" multiple hidden></label>
  </div>
  <p class="sub">PDF books as resizable text. Everything stays on this device.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="contSec" class="sec" hidden>
    <div class="sech"><h2>Continue reading</h2></div>
    <div id="continue" class="cont"></div>
  </section>
  <div id="shelf"></div>
  <button id="newShelf" class="btn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New shelf</button>
  <div id="empty" class="empty" hidden>
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M8 9.5c5-2 11-2 16 1.5 5-3.5 11-3.5 16-1.5v28c-5-2-11-2-16 1.5-5-3.5-11-3.5-16-1.5z"/><path d="M24 11v28"/></svg>
    <strong>Add your first book</strong>
    <p>Choose a PDF with Add PDF, or drop one here. Nothing is uploaded: your books and progress stay in this browser.</p>
  </div>
</main>

<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle"><h2 id="sheetTitle" class="clamp"></h2><div id="sheetBody"></div></dialog>

<div id="reader" hidden>
  <header class="rbar">
    <button id="back" aria-label="Back to library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="rtitle"></span>
    <button id="origBtn" aria-label="View original page">Original</button>
    <button id="setBtn" aria-label="Reading settings" aria-expanded="false" aria-controls="settings">Aa</button>
  </header>
  <div id="settings" hidden role="group" aria-label="Reading settings">
    <div class="size">
      <button id="s-dn" aria-label="Smaller text">A</button>
      <input id="s-size" type="range" min="14" max="34" step="1" aria-label="Text size">
      <button id="s-up" aria-label="Larger text">A</button>
      <span id="s-val" aria-hidden="true"></span>
    </div>
    <div class="sgrid">
      <div><span class="sl" id="l-lh">Line spacing</span>
        <div class="seg" data-k="lh" role="group" aria-labelledby="l-lh">
          <button data-v="1.4" aria-label="Tight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 9h14M5 12h14M5 15h14"/></svg></button>
          <button data-v="1.6" aria-label="Normal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7.5h14M5 12h14M5 16.5h14"/></svg></button>
          <button data-v="1.85" aria-label="Relaxed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button>
          <button data-v="2.1" aria-label="Loose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4.5h14M5 12h14M5 19.5h14"/></svg></button>
        </div></div>
      <div><span class="sl" id="l-margin">Margins</span>
        <div class="seg" data-k="margin" role="group" aria-labelledby="l-margin">
          <button data-v="8" aria-label="Narrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M6.5 8.5h11M6.5 12h11M6.5 15.5h11"/></svg></button>
          <button data-v="20" aria-label="Normal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M8 8.5h8M8 12h8M8 15.5h8"/></svg></button>
          <button data-v="36" aria-label="Wide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M9.5 8.5h5M9.5 12h5M9.5 15.5h5"/></svg></button>
          <button data-v="56" aria-label="Extra wide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M11 8.5h2M11 12h2M11 15.5h2"/></svg></button>
        </div></div>
      <div><span class="sl" id="l-align">Alignment</span>
        <div class="seg" data-k="align" role="group" aria-labelledby="l-align">
          <button data-v="start" aria-label="Left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6.5h14M5 10.5h9M5 14.5h12M5 18.5h7"/></svg></button>
          <button data-v="justify" aria-label="Justified"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6.5h14M5 10.5h14M5 14.5h14M5 18.5h7"/></svg></button>
        </div></div>
      <div><span class="sl" id="l-theme">Theme</span>
        <div class="seg themes" data-k="theme" role="group" aria-labelledby="l-theme">
          <button data-v="light" data-t="light" aria-label="Light">Aa</button><button data-v="sepia" data-t="sepia" aria-label="Sepia">Aa</button><button data-v="dark" data-t="dark" aria-label="Dark">Aa</button>
        </div></div>
    </div>
  </div>
  <article id="text"></article>
  <footer id="pos" aria-live="off"></footer>
</div>

<div id="orig" hidden role="dialog" aria-label="Original page">
  <div class="obar">
    <button id="oprev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="opage"></span>
    <button id="onext" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="done" id="oclose">Done</button>
  </div>
  <canvas id="ocanvas"></canvas>
</div>

<script id="reflow-core">
// Reflow core: pure functions, no DOM, no pdf.js. Coordinates are page space with y pointing down.
// Self-check: `node test/selftest.mjs` (or Reflow.selfTest() in the console).
const Reflow = (() => {
  'use strict';
  const HEAD = 1.18;                                  // heading if the line's main font is >= 1.18 x body size
  const ENDS = /[.!?…]['"”’»)\]]*$|[—–-]['"”’]$/u;   // line ends a sentence
  const WORD = /[\p{L}\p{N}](?:[\p{L}\p{N}'’-]*[\p{L}\p{N}])?/gu;
  const ROMAN = /^(?=[ivxlcdm]+$)m{0,3}(cm|cd|d?c{0,3})(xc|xl|l?x{0,3})(ix|iv|v?i{0,3})$/i;
  const median = a => { const s = a.slice().sort((x, y) => x - y); return s.length ? s[s.length >> 1] : 0; };

  function isPageNum(t) {
    const m = t.trim().match(/^[-–—\s]*(?:page\s*)?([0-9]{1,4}|[ivxlcdm]{1,7})(?:\s*(?:of|\/)\s*[0-9]{1,4})?[-–—\s]*$/i);
    return !!m && (/^[0-9]/.test(m[1]) || ROMAN.test(m[1]));
  }

  // 1) Text items {str, x, y (baseline), w, size} -> lines {text, x, xEnd, y, size}, top to bottom.

    const its = items.filter(i => i.str).sort((a, b) => a.y - b.y || a.x - b.x), groups = [];
    for (const it of its) {

      { str: 'world', x: 43, y: 100, w: 30, size: 10 }, { str: 'Hello', x: 10, y: 100, w: 30, size: 10 },
      { str: '2', x: 73.5, y: 96, w: 4, size: 6 }, { str: 'Next', x: 10, y: 112, w: 20, size: 10 },

      if (p > 0 && p !== 3) add(`the ${w} road home.`, { full: false });      // end of the paragraph from the last page
      add(`The ${w} lamp was lit at dusk`, { x: 25 }); add('and burned until the morning'); add('came at last.', { full: false });

      want.push(`The ${w} lamp was lit at dusk and burned until the morning came at last.`,
        p === 2 ? 'Then the cedar keeper spoke and the page ended exactly.'

    eq(one([' A half-forgotten tune on snow-heavy hills was half-for-', 'gotten by the snow-', 'heavy hills, and it hap-', 'pened.']),

    eq(one(['Margin line that ends here.', ' The notice says you may not copy', ' this book in any form.', ' Next paragraph', 'ends at the margin.']),

})();

  const cover = m => {
    const c = el('span', 'cover'), bytes = covers.get(m.id);
    if (bytes) { const img = el('img'), u = URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' })); coverUrls.push(u); img.src = u; img.alt = ''; img.decoding = 'async'; c.append(img); }
    else c.append(el('span', 'ph', m.title));
    return c;
  };
  const reading = books.filter(m => m.pct > 0 && m.pct < 100).slice(0, 12);
  $('#continue').replaceChildren(...reading.map(m => {
    const b = el('button', 'citem'), info = el('span', 'info');
    info.append(el('span', 't clamp', m.title), el('span', 'meta', `Page ${m.page} of ${m.pages} · ${m.pct}%`), bar(m.pct));
    b.append(cover(m), info);
    b.onclick = () => openBook(m.id);
    return b;
  }));
  $('#contSec').hidden = !reading.length;

  const tile = m => {
    const li = el('li', 'book'), open = el('button', 'open'), row = el('div', 'brow');
    open.append(cover(m));
    if (m.pct > 0 && m.pct < 100) open.append(bar(m.pct));
    open.append(el('span', 't clamp', m.title));
    open.onclick = () => openBook(m.id);
    row.append(el('span', 'meta', progress(m)), iconBtn('more', 'Options for ' + m.title, () => bookMenu(m, shelves)));
    li.append(open, row);
    return li;
  };
  const known = new Set(shelves.map(s => s.id)), groups = shelves.map(s => ({ s, books: books.filter(m => m.shelf === s.id) }));
  const loose = books.filter(m => !known.has(m.shelf));
  if (loose.length) groups.push({ s: null, books: loose });
  $('#shelf').replaceChildren(...groups.map(({ s, books: list }) => {
    const sec = el('section', 'sec'), head = el('div', 'sech');
    head.append(el('h2', '', s ? s.name : shelves.length ? 'Unsorted' : 'All books'), el('span', 'n', list.length));
    if (s) head.append(iconBtn('more', `Options for shelf ${s.name}`, () => shelfMenu(s)));
    const grid = el('ul', 'grid');
    grid.append(...list.map(tile));
    sec.append(head, list.length ? grid : el('p', 'none', 'No books here yet. Open a book’s options to move it onto this shelf.'));
    return sec;
  }));
  $('#empty').hidden = books.length > 0;
  $('#newShelf').hidden = !books.length;
  backfillCovers(books.filter(m => !covers.has(m.id)));
}

// Books added before covers existed get one in the background, one at a time.
let filling = false;
async function backfillCovers(list) {
  if (filling || !list.length) return;
  filling = true;
  for (const m of list) {
    let blob = null;
    try {
      const doc = await openPdf(await get('files', m.id));
      try { blob = await makeCover(doc); } finally { doc.destroy(); }
    } catch {}
    await put('covers', m.id, blob).catch(() => {});   // null marks "tried", so a broken PDF isn't retried forever
  }
  filling = false;
  if (!book) shelf();
}

// ---- Options sheet ----
const sheet = $('#sheet');
sheet.onclick = e => { if (e.target === sheet) sheet.close(); };   // tap outside the sheet closes it
function openSheet(title, fill) {
  $('#sheetTitle').textContent = title;
  $('#sheetBody').replaceChildren();
  fill($('#sheetBody'));
  if (!sheet.open) sheet.showModal();
}
// One row of the sheet. fn returning false keeps the sheet open (it asked for a name, or a confirm was declined).
function act(label, icon, fn, opts = {}) {
  const b = el('button', 'act' + (opts.danger ? ' danger' : ''));
  b.append(svg(ICON[icon]), el('span', '', label));
  if (opts.on) { const c = svg(ICON.check); c.classList.add('on'); b.append(c); b.setAttribute('aria-current', 'true'); }
  b.onclick = async () => { if (await fn() !== false) { sheet.close(); shelf(); } };
  return b;
}
function askName(title, value, label, save, what = 'Shelf name', max = 60) {
  openSheet(title, body => {
    const f = el('form', 'nameform'), input = el('input'), ok = el('button', 'btn primary', label);
    input.value = value; input.maxLength = max; input.placeholder = what; input.setAttribute('aria-label', what); input.enterKeyHint = 'done';
    f.onsubmit = async e => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) return input.focus();
      await save(name); sheet.close(); shelf();
    };
    f.append(input, ok); body.append(f);
    requestAnimationFrame(() => input.focus());
  });
  return false;
}
const addShelf = async name => { const s = { id: 's' + Date.now().toString(36), name, order: Date.now() }; await put('shelves', s.id, s); return s.id; };
async function moveBook(id, shelfId) {
  const m = await get('meta', id);
  if (shelfId) m.shelf = shelfId; else delete m.shelf;
  await put('meta', id, m);
}
function bookMenu(m, shelves) {
  openSheet(m.title, body => {
    const here = shelves.some(s => s.id === m.shelf) ? m.shelf : null;
    body.append(el('p', 'lbl', 'Shelf'));
    for (const s of shelves) body.append(act(s.name, 'shelf', () => moveBook(m.id, s.id), { on: here === s.id }));
    if (shelves.length) body.append(act('Unsorted', 'tray', () => moveBook(m.id, null), { on: !here }));
    body.append(act('New shelf…', 'plus', () => askName('New shelf', '', 'Create', async name => moveBook(m.id, await addShelf(name)))),
      el('hr'),
      act('Rename book', 'pencil', () => askName('Rename book', m.title, 'Save',
        async title => { const x = await get('meta', m.id); x.title = title; await put('meta', m.id, x); }, 'Book title', 200)),
      act('Delete from this device', 'trash', async () => {
        if (!confirm(`Delete “${m.title}” from this device? Its reading position goes too.`)) return false;
        await Promise.all(BOOK_STORES.map(s => del(s, m.id)));
      }, { danger: true }));
  });
}
function shelfMenu(s) {
  openSheet(s.name, body => body.append(
    act('Rename shelf', 'pencil', () => askName('Rename shelf', s.name, 'Save', name => put('shelves', s.id, { ...s, name }))),
    act('Delete shelf', 'trash', async () => {
      if (!confirm(`Delete the shelf “${s.name}”? Its books move to Unsorted.`)) return false;
      for (const m of await all('meta')) if (m.shelf === s.id) await moveBook(m.id, null);
      await del('shelves', s.id);
    }, { danger: true })));
}
$('#newShelf').onclick = () => askName('New shelf', '', 'Create', addShelf);

function cleanTitle(t) {
  t = (t || '').trim();
  return t.length > 2 && !/\.(pdf|docx?|indd|tex|rtf)$/i.test(t) && !/^(untitled|microsoft word)/i.test(t) ? t : '';
}

async function addFiles(files) {
  await dbReady;
  if (!db) return;
  navigator.storage?.persisted?.().then(p => p || navigator.storage.persist()).catch(() => {});   // keep books from being evicted
  for (const f of files) {
    if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { status(`“${f.name}” isn't a PDF.`); continue; }
    const id = f.name + ':' + f.size;
    if (await get('meta', id)) { status(`“${f.name}” is already on your shelf.`); continue; }
    try {
      const buf = await f.arrayBuffer();
      const r = await processPdf(buf.slice(0), (n, of) => status(`Reading “${f.name}”: page ${n} of ${of}…`));
      await put('files', id, buf);
      await put('text', id, r.text);
      await put('covers', id, r.cover);
      await put('meta', id, { id, title: r.title || f.name.replace(/\.pdf$/i, '').replace(/_+/g, ' ').trim(), pages: r.text.numPages, page: 1, pct: 0, added: Date.now() });
      status('');
    } catch (e) {
      await Promise.all(['files', 'text', 'covers'].map(s => del(s, id))).catch(() => {});
      status(e?.name === 'PasswordException' ? `“${f.name}” is password-protected, which isn't supported.`
        : e?.name === 'QuotaExceededError' ? 'There is not enough free storage on this device for that PDF.'
        : `Couldn't read “${f.name}”: ${e?.message || e}`);
    }
    await shelf();
  }
}
$('#file').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
addEventListener('dragover', e => { e.preventDefault(); if (!book) document.body.classList.add('drag'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drag'); if (!book) addFiles([...e.dataTransfer.files]); });

// Page 1 drawn 360 px wide as JPEG bytes (~30 KB): the book's cover on the shelf. Stored as an ArrayBuffer,
// not a Blob: some WebKit builds can't put Blobs in IndexedDB.
async function makeCover(doc) {
  const page = await doc.getPage(1), vp = page.getViewport({ scale: 360 / page.getViewport({ scale: 1 }).width });
  const c = document.createElement('canvas');
  c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  return blob ? blob.arrayBuffer() : null;
}

// ---- PDF -> reflowed blocks (runs once per book, result cached in IndexedDB) ----
async function processPdf(buf, progress) {
  const doc = await openPdf(buf), N = doc.numPages, pages = [];
  try {
    for (let n = 1; n <= N; n++) {
      const page = await doc.getPage(n), vp = page.getViewport({ scale: 1 }), tc = await page.getTextContent(), items = [];
      for (const it of tc.items) {
        if (!it.str) continue;
        const t = pdfjs.Util.transform(vp.transform, it.transform);       // viewport space: rotation applied, y down
        if (it.str.trim() && (t[0] <= 0 || Math.abs(t[1]) > 0.1 * t[0])) continue;   // vertical / mirrored text
        items.push({ str: it.str, x: t[4], y: t[5], w: it.width, size: Math.hypot(t[2], t[3]) });
      }
      const lines = Reflow.lines(items);
      pages.push({ lines, w: vp.width, h: vp.height, chars: lines.reduce((s, l) => s + l.text.length, 0) });
      page.cleanup();
      if (n % 5 === 0 || n === N) progress(n, N);
    }
    // Pages with almost no text become image blocks if they paint something (cover, map, scanned page).
    const O = pdfjs.OPS, IMG = new Set([O.paintImageXObject, O.paintInlineImageXObject, O.paintImageMaskXObject, O.paintImageXObjectRepeat,
      O.paintImageMaskXObjectRepeat, O.paintInlineImageXObjectGroup, O.paintImageMaskXObjectGroup, O.paintSolidColorImageMask]);
    for (const [i, p] of pages.entries()) {
      if (p.chars >= 40) continue;
      const ops = (await (await doc.getPage(i + 1)).getOperatorList()).fnArray;
      p.image = ops.some(f => IMG.has(f)) || ops.filter(f => f === O.constructPath).length > 20;
    }
    const r = Reflow.reflow(pages), info = (await doc.getMetadata().catch(() => null))?.info;
    return { title: cleanTitle(info?.Title), cover: await makeCover(doc).catch(() => null), text: { v: V, numPages: N, scan: pages.filter(p => p.image).length >= N / 2, blocks: r.blocks, removed: r.removed.length } };
  } finally { doc.destroy(); }
}

// ---- Reader ----
let book = null, els = [];   // book: {id, meta, text, doc, urls, io}; els: one element per block
const reader = $('#reader');

async function openBook(id, push = true) {
  const meta = await get('meta', id);
  if (!meta) return;
  let text = await get('text', id);
  if (!text || text.v !== V) {
    try { text = (await processPdf(await get('files', id), (n, of) => status(`Updating reflow: page ${n} of ${of}…`))).text; }
    catch (e) { return status(`Couldn't open this book: ${e?.message || e}`); }
    await put('text', id, text); status('');
  }
  book = { id, meta, text, doc: null, urls: [] };
  if (push) history.pushState({ book: id }, '');
  $('#library').hidden = true; reader.hidden = false;
  $('#rtitle').textContent = meta.title;
  render();
  restore(meta.pos);
  requestAnimationFrame(() => { restore(meta.pos); reader.classList.toggle('hide', scrollY > 80); });
  meta.opened = Date.now(); put('meta', id, meta);
}

function render() {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); drawPage(e.target); } }), { rootMargin: '1200px 0px' });
  book.io = io;
  els = book.text.blocks.map((b, i) => {
    let e;
    if (b.t === 'img') {
      e = el('figure'); const pg = el('div', 'pg'); pg.style.aspectRatio = b.w + ' / ' + b.h; e.append(pg);
      if (book.text.scan) e.append(el('figcaption', '', "This page is a scan, so reflow isn't supported yet."));
      io.observe(e);
    } else {
      e = el(b.t === 'h' ? (b.lvl === 1 ? 'h2' : 'h3') : 'p', [b.center && 'c', b.sep && 'sep', b.t === 'n' && 'note'].filter(Boolean).join(' '), b.text);
    }
    e.dataset.i = i; e.dataset.p = b.page;
    return e;
  });
  if (!els.length) els = [el('p', 'c', 'No readable text was found in this PDF. Use “Original” to view its pages.')];
  $('#text').replaceChildren(...els);
  showPos();
}

const getDoc = () => book.doc ||= get('files', book.id).then(openPdf);

async function drawPage(fig) {
  const b = book, box = fig.firstChild, doc = await getDoc(), c = document.createElement('canvas');
  await renderPage(doc, +fig.dataset.p, c, box.clientWidth);
  c.toBlob(blob => {
    if (book !== b || !blob) return;
    const img = new Image(), url = URL.createObjectURL(blob); b.urls.push(url);
    img.src = url; img.alt = 'Page ' + (+fig.dataset.p + 1); box.append(img); c.width = c.height = 0;
  }, 'image/jpeg', 0.85);
}

async function renderPage(doc, p, canvas, cssWidth, task) {
  const page = await doc.getPage(p + 1), w = page.getViewport({ scale: 1 }).width;
  const vp = page.getViewport({ scale: cssWidth * Math.min(devicePixelRatio || 1, 2) / w });
  canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height); canvas.style.width = cssWidth + 'px';
  const t = page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
  if (task) task.current = t;
  await t.promise;
}

// Position = first block whose bottom is below the viewport top, plus how far into it we are (negative when
// the viewport top sits in the margin above it).
function anchor() {
  let lo = 0, hi = els.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (els[m].getBoundingClientRect().bottom <= 0) lo = m + 1; else hi = m; }
  const r = els[lo].getBoundingClientRect();
  return { i: lo, f: r.height ? -r.top / r.height : 0 };
}
function restore(pos) {
  const e = pos && els[pos.i];
  if (!e) return scrollTo(0, 0);
  const r = e.getBoundingClientRect();
  scrollTo(0, scrollY + r.top + pos.f * r.height);
}
function where() {
  const a = anchor(), N = book.text.numPages, atEnd = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
  const page = atEnd ? N : (+els[a.i].dataset.p || 0) + 1;
  return { pos: a, page, pct: Math.round(page / N * 100) };
}
function showPos() { const w = where(); $('#pos').textContent = `Page ${w.page} of ${book.text.numPages} · ${w.pct}%`; }
async function savePos() {
  if (!book) return;
  const w = where(), m = book.meta;
  m.pos = w.pos; m.page = w.page; m.pct = w.pct;
  await put('meta', book.id, m).catch(() => {});
}

let raf = 0, saveT = 0, lastY = 0;
addEventListener('scroll', () => {
  if (!book) return;
  const y = scrollY;
  if (Math.abs(y - lastY) > 8) { reader.classList.toggle('hide', y > lastY && y > 80 && $('#settings').hidden); lastY = y; }
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (book) showPos(); });
  clearTimeout(saveT); saveT = setTimeout(savePos, 400);
}, { passive: true });
addEventListener('pagehide', savePos);
document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(); });
function showSettings(open) {
  $('#settings').hidden = !open; reader.classList.toggle('set', open);
  $('#setBtn').setAttribute('aria-expanded', open);
}
// Tapping the page closes the settings sheet if it's open, otherwise shows or hides the toolbar.
$('#text').onclick = () => {
  if (!$('#settings').hidden) showSettings(false);
  else if (!getSelection().toString()) reader.classList.toggle('hide');
};
$('#setBtn').onclick = () => showSettings($('#settings').hidden);
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#settings').hidden) showSettings(false); });

async function closeBook(pop = false) {
  if (!book) return;
  await savePos();
  book.io?.disconnect(); book.urls.forEach(URL.revokeObjectURL);
  book.doc?.then(d => d.destroy()).catch(() => {});
  book = null; els = [];
  $('#text').replaceChildren(); showSettings(false); $('#orig').hidden = true;
  reader.hidden = true; reader.classList.remove('hide'); $('#library').hidden = false;
  scrollTo(0, 0);
  if (!pop && history.state?.book) history.back();
  shelf();
}
$('#back').onclick = () => closeBook();
addEventListener('popstate', () => { if (book && !history.state?.book) closeBook(true); });

// ---- Original page view ----
let origP = 0;
const origTask = { current: null };
async function showOrig(p) {
  const doc = await getDoc();
  origP = Math.max(0, Math.min(doc.numPages - 1, p));
  $('#orig').hidden = false;
  $('#opage').textContent = `Page ${origP + 1} of ${doc.numPages}`;
  origTask.current?.cancel();
  const c = $('#ocanvas'); c.dataset.page = '';
  try { await renderPage(doc, origP, c, Math.min(innerWidth - 16, 900), origTask); c.dataset.page = origP + 1; }
  catch (e) { if (e?.name !== 'RenderingCancelledException') throw e; }
}
$('#origBtn').onclick = () => showOrig(where().page - 1);
$('#oprev').onclick = () => showOrig(origP - 1);
$('#onext').onclick = () => showOrig(origP + 1);
$('#oclose').onclick = () => { $('#orig').hidden = true; };

await shelf();
if (history.state?.book) openBook(history.state.book, false);   // reload while reading: reopen at the saved spot
</script>
</body>
</html>
